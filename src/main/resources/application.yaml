server:
  port: 8085
spring:
  application:
    name: blog
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.100.131:3306/ll-blog?useSSL=false&serverTimezone=UTC
    username: root
    password: 123
  data:
    redis:
      host: 192.168.100.131
      port: 6379
      password: 123456
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
      database: 1
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.ll.blog.model.po # 别名扫描包
logging:
  level:
    com.ll.blog: debug
auth:
  token:
    expire: 7200   # Token 过期时间（秒）
#阿里云OSS
aliyun:
  oss:
    endpoint: https://oss-cn-chengdu.aliyuncs.com
    bucketName: ll-cc-blog
    region: cn-chengdu
#hexo配置
hexo:
  posts-path: classpath:hexo/source/_posts/